name: Check
on: [push, pull_request]
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Is CLI 2 on npm yet?
        id: cli
        run: |
          if npm view @networkbase/cli@2 version >/dev/null 2>&1; then echo "published=yes" >> "$GITHUB_OUTPUT"; else echo "::notice::@networkbase/cli@2 isn't on npm yet; the tool check runs once it is"; fi
      - name: The MCP server lists every tool the skill names
        if: steps.cli.outputs.published == 'yes'
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | NB_NO_UPDATE_CHECK=1 npx -y @networkbase/cli@2 mcp > out.jsonl
          for tool in $(grep -o 'networkbase_[a-z_]*' plugins/networkbase/skills/networkbase/SKILL.md | sort -u); do
            grep -q "\"$tool\"" out.jsonl || { echo "::error::missing tool $tool"; exit 1; }
          done
